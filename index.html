<!DOCTYPE html>
<html lang="ko">

<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8959572383644509"
    crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로또 한눈에 — 당첨번호 검색</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --gold: #f5c842;
      --gold2: #e8a820;
      --red: #e03030;
      --bg: #0a0a0f;
      --bg2: #13131e;
      --bg3: #1c1c2e;
      --border: rgba(255, 255, 255, 0.07);
      --text: #f0f0f8;
      --muted: #666688;
      --b1: #ffc200;
      --b2: #48baf0;
      --b3: #ff5c5c;
      --b4: #aaaaaa;
      --b5: #8ed832;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── 배경 그래픽 ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 80% 10%, rgba(245, 200, 66, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 10% 80%, rgba(72, 186, 240, 0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── 헤더 ── */
    header {
      position: relative;
      z-index: 10;
      padding: 48px 24px 32px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(2.4rem, 6vw, 4rem);
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #ffe066 0%, #f5a623 50%, #ff6b35 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-block;
    }

    .logo span {
      font-family: 'Space Mono', monospace;
      letter-spacing: 0;
    }

    .tagline {
      font-size: 0.78rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 6px;
    }

    /* ── 메인 컨테이너 ── */
    main {
      position: relative;
      z-index: 5;
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* ── 탭 ── */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg2);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 32px;
      border: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border-radius: 9px;
      transition: all 0.2s;
      color: var(--muted);
      border: none;
      background: none;
    }

    .tab.active {
      background: var(--gold);
      color: #0a0a0f;
      font-weight: 700;
    }

    .tab:hover:not(.active) {
      color: var(--text);
      background: var(--bg3);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* ── 패널 1: 회차 검색 ── */
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .search-box input {
      flex: 1;
      min-width: 120px;
      padding: 14px 18px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--gold);
    }

    .search-box input::placeholder {
      color: var(--muted);
    }

    .btn-gold {
      padding: 14px 26px;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #0a0a0f;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      white-space: nowrap;
    }

    .btn-gold:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(245, 200, 66, 0.35);
    }

    .btn-gold:active {
      transform: none;
    }

    .btn-gold:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ── 결과 카드 ── */
    .result-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      animation: fadeIn 0.35s ease;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .round-no {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 1.6rem;
      color: var(--gold);
    }

    .round-date {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .prize-info {
      text-align: right;
    }

    .prize-1st {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .prize-amt {
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem;
      color: #6af;
      margin-top: 2px;
    }

    .balls-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .ball {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 0.95rem;
      position: relative;
      cursor: default;
      transition: transform 0.2s;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .ball:hover {
      transform: scale(1.08);
    }

    .ball.sm {
      width: 36px;
      height: 36px;
      font-size: 0.82rem;
    }

    .c1 {
      background: radial-gradient(circle at 35% 35%, #ffe566, #ffc200);
      color: #3a2000;
    }

    .c2 {
      background: radial-gradient(circle at 35% 35%, #7ad8ff, #48baf0);
      color: #003050;
    }

    .c3 {
      background: radial-gradient(circle at 35% 35%, #ff9090, #ff5c5c);
      color: #fff;
    }

    .c4 {
      background: radial-gradient(circle at 35% 35%, #ddd, #aaaaaa);
      color: #222;
    }

    .c5 {
      background: radial-gradient(circle at 35% 35%, #c0f050, #8ed832);
      color: #1a3000;
    }

    .ball-bonus {
      position: relative;
    }

    .ball-bonus::before {
      content: '+';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
    }

    .plus-sign {
      font-size: 1.2rem;
      color: var(--muted);
    }

    /* ── 당첨금 테이블 ── */
    .prize-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px;
      font-size: 0.83rem;
    }

    .prize-table th {
      color: var(--muted);
      padding: 6px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
    }

    .prize-table td {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .prize-table tr:last-child td {
      border-bottom: none;
    }

    .rank-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.75rem;
    }

    .r1 {
      background: rgba(245, 200, 66, 0.2);
      color: var(--gold);
    }

    .r2 {
      background: rgba(72, 186, 240, 0.15);
      color: #7ad8ff;
    }

    .r3 {
      background: rgba(255, 92, 92, 0.15);
      color: #ff9090;
    }

    .r4 {
      background: rgba(170, 170, 170, 0.15);
      color: #ccc;
    }

    .r5 {
      background: rgba(142, 216, 50, 0.15);
      color: #b8f060;
    }

    .money {
      font-family: 'Space Mono', monospace;
      color: #aaeeff;
      text-align: right;
    }

    /* ── 패널 2: 번호 검색 ── */
    .num-picker {
      margin-bottom: 28px;
    }

    .picker-label {
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .num-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
      gap: 6px;
      margin-bottom: 16px;
    }

    .num-btn {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .num-btn:hover {
      border-color: #666;
      color: var(--text);
    }

    .num-btn.sel {
      border-color: transparent;
      color: #0a0a0f !important;
      font-weight: 700;
      transform: scale(1.05);
    }

    .num-btn.c1.sel {
      background: var(--b1);
    }

    .num-btn.c2.sel {
      background: var(--b2);
    }

    .num-btn.c3.sel {
      background: var(--b3);
    }

    .num-btn.c4.sel {
      background: var(--b4);
    }

    .num-btn.c5.sel {
      background: var(--b5);
    }

    .selected-display {
      min-height: 52px;
      background: var(--bg3);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .sel-placeholder {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .search-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .match-select {
      padding: 10px 14px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
      cursor: pointer;
    }

    .match-select:focus {
      border-color: var(--gold);
    }

    .btn-ghost {
      padding: 10px 18px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-ghost:hover {
      border-color: #666;
      color: var(--text);
    }

    /* ── 결과 리스트 ── */
    .results-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .result-row {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      animation: fadeIn 0.25s ease;
      transition: border-color 0.2s;
    }

    .result-row:hover {
      border-color: rgba(245, 200, 66, 0.3);
    }

    .result-row .rno {
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      min-width: 60px;
    }

    .result-row .rno strong {
      display: block;
      font-size: 1rem;
      color: var(--gold);
    }

    .result-row .balls-mini {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      flex: 1;
    }

    /* ── 로딩 ── */
    .loading {
      text-align: center;
      padding: 48px 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .progress-wrap {
      margin: 12px auto 0;
      max-width: 280px;
    }

    .progress-track {
      height: 4px;
      background: var(--bg3);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold2));
      border-radius: 2px;
      transition: width 0.3s;
      width: 0%;
    }

    .err {
      color: #ff7777;
      text-align: center;
      padding: 24px;
      font-size: 0.9rem;
    }

    .count-badge {
      display: inline-block;
      background: rgba(245, 200, 66, 0.15);
      color: var(--gold);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 0.8rem;
      font-family: 'Space Mono', monospace;
      margin-bottom: 14px;
    }

    /* ── 최신 회차 배너 ── */
    .latest-banner {
      background: linear-gradient(135deg, rgba(245, 200, 66, 0.1), rgba(232, 168, 32, 0.05));
      border: 1px solid rgba(245, 200, 66, 0.25);
      border-radius: 14px;
      padding: 20px 22px;
      margin-bottom: 26px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .lb-label {
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold2);
      margin-bottom: 4px;
    }

    .lb-round {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 1.3rem;
      color: var(--gold);
    }

    /* ── 반응형 ── */
    @media (max-width: 520px) {
      .tabs {
        flex-wrap: wrap;
        gap: 4px;
        padding: 4px;
      }

      .tab {
        flex: 1 1 calc(30% - 4px);
        font-size: 0.78rem;
        padding: 10px 4px;
        letter-spacing: -0.02em;
      }

      .ball {
        width: 38px;
        height: 38px;
        font-size: 0.85rem;
      }

      .ball.sm {
        width: 32px;
        height: 32px;
        font-size: 0.75rem;
      }

      .result-row {
        padding: 12px 14px;
      }
    }

    /* ── 최하단 여백 ── */
    footer {
      text-align: center;
      padding: 32px;
      font-size: 0.72rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      margin-top: 40px;
      position: relative;
      z-index: 5;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">LOTTO<span>645</span></div>
    <p class="tagline">로또 번호 검색 AI 번호 추천 내 근처 명당</p>
  </header>

  <main>
    <!-- 탭 -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab(0)">🏆 최신 회차</button>
      <button class="tab" onclick="switchTab(1)">🔢 회차로 검색</button>
      <button class="tab" onclick="switchTab(2)">🔍 번호로 검색</button>
      <button class="tab" onclick="switchTab(3)">🤖 AI 추천</button>
      <button class="tab" onclick="switchTab(4)">📍 근처 명당</button>
      <button class="tab" onclick="switchTab(5)">🌙 해몽 분석</button>
    </div>

    <!-- 패널 0: 최신 -->
    <div class="panel active" id="panel0">
      <div id="latestResult"></div>
    </div>

    <!-- 패널 1: 회차 검색 -->
    <div class="panel" id="panel1">
      <div class="search-box">
        <input type="number" id="roundInput" placeholder="회차 입력 (예: 1220)" min="1" max="9999"
          onkeydown="if(event.key==='Enter') searchRound()">
        <button class="btn-gold" onclick="searchRound()">조회</button>
      </div>
      <div id="roundResult"></div>
    </div>

    <!-- 패널 2: 번호 검색 -->
    <div class="panel" id="panel2">
      <div class="num-picker">
        <div class="picker-label">번호 선택 (최대 6개)</div>
        <div class="num-grid" id="numGrid"></div>
        <div class="selected-display" id="selectedDisplay">
          <span class="sel-placeholder">번호를 클릭해서 선택하세요</span>
        </div>
        <div class="search-controls">
          <select class="match-select" id="matchMode">
            <option value="all">선택한 번호 모두 포함</option>
            <option value="any">하나 이상 포함</option>
          </select>
          <button class="btn-gold" onclick="searchByNums()">검색</button>
          <button class="btn-ghost" onclick="clearNums()">초기화</button>
        </div>
      </div>
      <div id="numsResult"></div>
    </div>

    <!-- 패널 3: AI 추천 -->
    <div class="panel" id="panel3">
      <div class="num-picker">
        <div class="picker-label">고정 번호 선택 (최대 5개)</div>
        <div class="num-grid" id="aiNumGrid"></div>
        <div class="selected-display" id="aiSelectedDisplay">
          <span class="sel-placeholder">반드시 포함할 고정 번호를 선택하세요 (선택안함 가능)</span>
        </div>
      </div>
      <div style="text-align:center; padding: 10px 0 30px;">
        <button class="btn-gold" style="font-size: 1.1rem; padding: 16px 36px; border-radius: 12px;"
          onclick="generateAIGames()">🤖 고정번호 포함 5게임 추천받기</button>
        <p style="color:var(--muted); font-size:0.85rem; margin-top:16px;">선택한 고정 번호를 포함하여 AI 알고리즘이 최적의 번호를 추천합니다.</p>
      </div>
      <div id="aiResult" class="results-list"></div>
    </div>

    <!-- 패널 4: 근처 명당 -->
    <div class="panel" id="panel4">
      <div style="text-align:center; padding: 10px 0 30px;">
        <div style="margin-bottom: 24px; text-align: left; max-width: 340px; margin: 0 auto 24px; background:var(--bg2); padding: 20px; border-radius: 12px; border: 1px solid var(--border);">
          <div style="margin-bottom: 18px;">
            <div style="display:flex; justify-content:space-between; margin-bottom: 10px;">
              <label for="radiusSlider" class="picker-label" style="margin:0;">검색 반경</label>
              <span id="radiusValue" style="color:var(--gold); font-family:'Space Mono', monospace; font-size:0.95rem; font-weight:700;">10km</span>
            </div>
            <input type="range" id="radiusSlider" min="3" max="30" value="10" step="1" style="width:100%; cursor:pointer; accent-color:var(--gold);" oninput="document.getElementById('radiusValue').innerText = this.value + 'km'">
          </div>
          <div>
            <div style="display:flex; justify-content:space-between; margin-bottom: 10px;">
              <label for="minWinsSlider" class="picker-label" style="margin:0;">명당 기준 (최소 1등 배출)</label>
              <span id="minWinsValue" style="color:var(--gold); font-family:'Space Mono', monospace; font-size:0.95rem; font-weight:700;">3번</span>
            </div>
            <input type="range" id="minWinsSlider" min="3" max="20" value="3" step="1" style="width:100%; cursor:pointer; accent-color:var(--gold);" oninput="document.getElementById('minWinsValue').innerText = this.value + '번'">
          </div>
        </div>
        <button class="btn-gold" style="font-size: 1.1rem; padding: 16px 36px; border-radius: 12px;"
          onclick="findNearbyStores()">📍 내 위치로 근처 명당 찾기</button>
        <p style="color:var(--muted); font-size:0.85rem; margin-top:16px;">설정한 반경 내에 있는 전국 1등 배출 명당을 거리순으로 찾습니다.<br>(위치 권한 허용 필요)</p>
      </div>
      <div id="storesResult" class="results-list"></div>
    </div>

    <!-- 패널 5: 해몽 분석 -->
    <div class="panel" id="panel5">
      <div style="text-align:center; padding: 10px 0 30px;">
        <div style="margin-bottom: 24px; text-align: left; max-width: 100%; margin: 0 auto 24px; background:var(--bg2); padding: 20px; border-radius: 12px; border: 1px solid var(--border);">
          <label for="dreamInput" class="picker-label" style="display:block; margin-bottom:12px; font-size:1.05rem;">간밤에 어떤 꿈을 꾸셨나요?</label>
          <textarea id="dreamInput" placeholder="예: 돼지가 집 안으로 들어와서 제 품에 안기는 꿈을 꾸었어요." rows="5" style="width: 100%; padding: 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 1rem; resize: vertical; margin-bottom: 16px; font-family: inherit;"></textarea>
          <button class="btn-gold" style="width: 100%; font-size: 1.1rem; padding: 16px; border-radius: 8px;"
            onclick="analyzeDream()">✨ 꿈 풀이 및 복권 운 확인하기</button>
        </div>
      </div>
      <div id="dreamResult" class="results-list"></div>
    </div>
  </main>

  <footer>본 사이트는 동행복권 공식 API 데이터를 사용합니다. 정확한 당첨 확인은 동행복권 공식 홈페이지를 이용하세요.</footer>

  <script>
    // ── 유틸 ──────────────────────────────────────────────────────────────
    function ballColor(n) {
      if (n <= 9) return 'c1';
      if (n <= 19) return 'c2';
      if (n <= 29) return 'c3';
      if (n <= 39) return 'c4';
      return 'c5';
    }

    function makeBall(n, small = false, highlight = false) {
      const cls = [small ? 'ball sm' : 'ball', ballColor(n)];
      const style = highlight ? ' style="outline:3px solid #fff; outline-offset:2px;"' : '';
      return `<div class="${cls.join(' ')}"${style}>${n}</div>`;
    }

    function makeBonusBall(n) {
      return `<div class="ball sm ball-bonus ${ballColor(n)}">${n}</div>`;
    }

    function fmt(n) {
      return Number(n).toLocaleString('ko-KR') + '원';
    }

    async function fetchRound(no) {
      // 1순위: 네이버 파싱 (Vercel Serverless Function)
      try {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), 6000);
        const r = await fetch(`/api/naver?drwNo=${no}`, { signal: controller.signal });
        clearTimeout(id);
        
        if (r.ok) {
          const d = await r.json();
          if (d && d.returnValue === 'success') {
            return {
              no: d.drwNo, date: d.drwNoDate,
              nums: [d.drwtNo1, d.drwtNo2, d.drwtNo3, d.drwtNo4, d.drwtNo5, d.drwtNo6].sort((a, b) => a - b),
              bonus: d.bnusNo,
              firstWinCnt: d.firstPrzwnerCo, firstWinAmt: d.firstWinamnt,
              firstAccumAmt: 0,
              autoCnt: null, manualCnt: null, semiCnt: null,
              raw: d
            };
          }
        }
      } catch (e) { console.log('네이버 파싱 실패, 동행복권으로 폴백'); }

      // 2순위: Vercel 동행복권 프록시 경로
      const apiUrl = `/api/lotto?method=getLottoNumber&drwNo=${no}`;

      try {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), 6000); // 6초 대기
        const r = await fetch(apiUrl, { signal: controller.signal });
        clearTimeout(id);

        if (!r.ok) return null;
        const d = await r.json();
        if (!d || d.returnValue !== 'success') return null;

        // 1등 유형 (자동/수동) 크롤링
        let autoCnt = null, manualCnt = null, semiCnt = null;
        try {
          const htmlUrl = `/api/lotto-html?method=byWin&drwNo=${no}`;
          const r2 = await fetch(htmlUrl);
          if (r2.ok) {
            const htmlText = await r2.text();
            autoCnt = (htmlText.match(/<td>\s*자동\s*<\/td>/g) || []).length;
            manualCnt = (htmlText.match(/<td>\s*수동\s*<\/td>/g) || []).length;
            semiCnt = (htmlText.match(/<td>\s*반자동\s*<\/td>/g) || []).length;
          }
        } catch (e) { }

        return {
          no: d.drwNo, date: d.drwNoDate,
          nums: [d.drwtNo1, d.drwtNo2, d.drwtNo3, d.drwtNo4, d.drwtNo5, d.drwtNo6].sort((a, b) => a - b),
          bonus: d.bnusNo,
          firstWinCnt: d.firstPrzwnerCo, firstWinAmt: d.firstWinamnt,
          firstAccumAmt: d.firstAccumamnt,
          autoCnt, manualCnt, semiCnt,
          raw: d
        };
      } catch (e) {
        return null;
      }
    }

    // ── 탭 전환 ──────────────────────────────────────────────────────────
    const tabs = document.querySelectorAll('.tab');
    const panels = document.querySelectorAll('.panel');
    let latestLoaded = false;

    function switchTab(i) {
      tabs.forEach((t, j) => t.classList.toggle('active', i === j));
      panels.forEach((p, j) => p.classList.toggle('active', i === j));
      if (i === 0 && !latestLoaded) { latestLoaded = true; loadLatest(); }
    }

    // ── 결과 카드 렌더 ────────────────────────────────────────────────────
    function renderCard(d, highlights = []) {
      const r = d.raw;

      let winTypesHtml = '';
      if (d.autoCnt !== null && d.manualCnt !== null) {
        winTypesHtml = `<div style="font-size:0.75rem; color:var(--muted); margin-top:6px; text-align:right;">
          (자동 ${d.autoCnt}명 / 수동 ${d.manualCnt}명${d.semiCnt ? ` / 반자동 ${d.semiCnt}명` : ''})
        </div>`;
      }

      return `
  <div class="result-card">
    <div class="result-header">
      <div>
        <div class="round-no">${d.no}회</div>
        <div class="round-date">${d.date} 추첨</div>
      </div>
      <div class="prize-info">
        <div class="prize-1st">1등 당첨: 총 ${(r.firstPrzwnerCo || 0).toLocaleString()}명</div>
        <div class="prize-amt">${fmt(r.firstWinamnt)} <span style="font-size:0.8rem;font-weight:normal;color:#ccc;">(1인당)</span></div>
      </div>
    </div>
    <div class="balls-row">
      ${d.nums.map(n => makeBall(n, false, highlights.includes(n))).join('')}
      <span class="plus-sign">+</span>
      ${makeBonusBall(d.bonus)}
    </div>
    ${winTypesHtml}
  </div>`;
    }

    // ── 패널 0: 회차 검색 ────────────────────────────────────────────────
    async function searchRound() {
      const val = document.getElementById('roundInput').value.trim();
      const el = document.getElementById('roundResult');
      if (!val) return;
      const no = parseInt(val);
      if (isNaN(no) || no < 1) { el.innerHTML = '<div class="err">올바른 회차를 입력하세요.</div>'; return; }

      el.innerHTML = `<div class="loading"><div class="spinner"></div><div class="loading-text">${no}회 조회 중…</div></div>`;
      try {
        const d = await fetchRound(no);
        if (!d) { el.innerHTML = `<div class="err">${no}회 데이터가 없습니다.</div>`; return; }
        el.innerHTML = renderCard(d);
      } catch (e) {
        el.innerHTML = '<div class="err">데이터를 불러오지 못했습니다. 잠시 후 다시 시도하세요.</div>';
      }
    }

    // ── 패널 1: 번호 선택 ────────────────────────────────────────────────
    const selected = new Set();
    const MAX_SEL = 6;

    function buildNumGrid() {
      const grid = document.getElementById('numGrid');
      let html = '';
      for (let n = 1; n <= 45; n++) {
        html += `<button class="num-btn ${ballColor(n)}" id="nb${n}" onclick="toggleNum(${n})">${n}</button>`;
      }
      grid.innerHTML = html;
    }

    function toggleNum(n) {
      if (selected.has(n)) {
        selected.delete(n);
        document.getElementById('nb' + n).classList.remove('sel');
      } else {
        if (selected.size >= MAX_SEL) return;
        selected.add(n);
        document.getElementById('nb' + n).classList.add('sel');
      }
      updateSelectedDisplay();
    }

    function updateSelectedDisplay() {
      const el = document.getElementById('selectedDisplay');
      if (selected.size === 0) {
        el.innerHTML = '<span class="sel-placeholder">번호를 클릭해서 선택하세요</span>';
      } else {
        const sorted = [...selected].sort((a, b) => a - b);
        el.innerHTML = sorted.map(n => `<div class="ball sm ${ballColor(n)}">${n}</div>`).join('');
      }
    }

    function clearNums() {
      selected.forEach(n => document.getElementById('nb' + n)?.classList.remove('sel'));
      selected.clear();
      updateSelectedDisplay();
      document.getElementById('numsResult').innerHTML = '';
    }

    let allData = null;
    let loadingPromise = null;
    let latestRound = 1220; // 초기값, 자동 갱신됨

    // 최신 회차 번호를 수학적으로 정확하게 계산
    async function detectLatestRound() {
      const firstDrawDate = new Date('2002-12-07T20:45:00+09:00');
      const now = new Date();
      const diffTime = now.getTime() - firstDrawDate.getTime();
      const diffWeeks = Math.floor(diffTime / (1000 * 60 * 60 * 24 * 7));
      latestRound = 1 + diffWeeks;

      // 당일 20:45분 이전이거나 아직 업데이트 안되었을 경우를 대비해 확인
      const d = await fetchRound(latestRound).catch(() => null);
      if (!d) latestRound -= 1;

      return latestRound;
    }

    async function loadAllData(progressEl) {
      if (allData) return allData;
      if (loadingPromise) return loadingPromise; // 중복 호출 방지

      loadingPromise = (async () => {
        const TOTAL = latestRound;
        const BATCH = 50;
        allData = {};

        for (let i = 1; i <= TOTAL; i += BATCH) {
          const promises = [];
          for (let j = i; j < Math.min(i + BATCH, TOTAL + 1); j++) {
            promises.push(fetchRound(j).then(d => { if (d) allData[d.no] = d; }).catch(() => { }));
          }
          await Promise.all(promises);
          if (progressEl) {
            const pct = Math.min(100, Math.round((i + BATCH) / TOTAL * 100));
            progressEl.style.width = pct + '%';
          }
        }
        loadingPromise = null;
        return allData;
      })();

      return loadingPromise;
    }

    async function searchByNums() {
      const nums = [...selected].sort((a, b) => a - b);
      if (nums.length === 0) return;
      const mode = document.getElementById('matchMode').value;
      const el = document.getElementById('numsResult');

      el.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text" id="numLoadingText">전체 회차 데이터 수집 중… (1~2분 소요)</div>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-bar" id="numProgress"></div></div>
      </div>
    </div>`;

      try {
        // 이미 로드됐으면 즉시 검색
        if (!allData) {
          const progressBar = document.getElementById('numProgress');
          await loadAllData(progressBar);
        } else {
          document.getElementById('numLoadingText').textContent = '검색 중…';
        }

        const results = [];
        for (let no = 1; no <= latestRound; no++) {
          const d = allData[no]; if (!d) continue;
          const match = mode === 'all'
            ? nums.every(n => d.nums.includes(n))
            : nums.some(n => d.nums.includes(n));
          if (match) results.push(d);
        }

        if (results.length === 0) {
          el.innerHTML = `<div class="err">해당 번호가 포함된 회차가 없습니다.</div>`;
          return;
        }

        let html = `<div class="count-badge">총 ${results.length}개 회차 발견 (1~${latestRound}회 검색)</div>
    <div class="results-list">`;
        for (const d of results.reverse()) {
          html += `
      <div class="result-row">
        <div class="rno"><small>${d.date}</small><strong>${d.no}회</strong></div>
        <div class="balls-mini">
          ${d.nums.map(n => `<div class="ball sm ${ballColor(n)}" ${nums.includes(n) ? 'style="outline:2px solid rgba(255,255,255,0.6);outline-offset:1px;"' : ''}>${n}</div>`).join('')}
          <div style="color:var(--muted);font-size:0.75rem;display:flex;align-items:center;margin-left:2px;">+${d.bonus}</div>
        </div>
      </div>`;
        }
        html += `</div>`;
        el.innerHTML = html;
      } catch (e) {
        el.innerHTML = '<div class="err">데이터를 불러오지 못했습니다.</div>';
      }
    }

    // ── 패널 2: 최신 회차 ────────────────────────────────────────────────
    async function loadLatest() {
      const el = document.getElementById('latestResult');
      el.innerHTML = `<div class="loading"><div class="spinner"></div><div class="loading-text">최신 회차 탐색 중…</div></div>`;

      try {
        const latestNo = await detectLatestRound();
        const latest = await fetchRound(latestNo);
        if (!latest) { el.innerHTML = '<div class="err">최신 데이터 조회 실패</div>'; return; }

        // 최근 5개 병렬 로드
        const recentNos = [];
        for (let n = latestNo; n >= Math.max(1, latestNo - 4); n--) recentNos.push(n);
        const recents = (await Promise.all(recentNos.map(n => fetchRound(n).catch(() => null)))).filter(Boolean);

        let html = renderCard(latest);

        html += `<div style="margin-top:28px;margin-bottom:12px;font-size:0.78rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted)">최근 5회차</div>
    <div class="results-list">`;

        for (const d of recents.slice(1)) {
          html += `<div class="result-row" onclick="const detail = this.nextElementSibling; detail.style.display = detail.style.display === 'none' ? 'block' : 'none';" style="cursor:pointer; transition: background 0.2s;" title="클릭해서 당첨 정보 보기">
        <div class="rno"><small>${d.date}</small><strong>${d.no}회</strong></div>
        <div class="balls-mini">
          ${d.nums.map(n => `<div class="ball sm ${ballColor(n)}">${n}</div>`).join('')}
          <div style="color:var(--muted);font-size:0.75rem;display:flex;align-items:center;margin-left:2px;">+${d.bonus}</div>
        </div>
      </div>
      <div class="recent-detail" style="display:none; padding: 12px 16px; background: rgba(255,255,255,0.03); border-radius: 8px; margin-bottom: 12px; margin-top:-4px; text-align: center; font-size: 0.95rem; border: 1px solid var(--border);">
        <span style="color:var(--muted);">1등 당첨:</span> <strong style="color:#fff;">${(d.raw.firstPrzwnerCo || 0).toLocaleString()}명</strong> &nbsp;|&nbsp; 
        <span style="color:var(--muted);">1인당 당첨금:</span> <strong style="color:var(--gold);">${fmt(d.raw.firstWinamnt || 0)}</strong>
      </div>`;
        }
        html += '</div>';
        el.innerHTML = html;
      } catch (e) {
        el.innerHTML = '<div class="err">데이터를 불러오지 못했습니다.</div>';
      }
    }

    // ── 패널 3: AI 추천 ──────────────────────────────────────────────────
    const aiSelected = new Set();
    const MAX_AI_SEL = 5;

    function buildAINumGrid() {
      const grid = document.getElementById('aiNumGrid');
      let html = '';
      for (let n = 1; n <= 45; n++) {
        html += `<button class="num-btn ${ballColor(n)}" id="ai_nb${n}" onclick="toggleAINum(${n})">${n}</button>`;
      }
      grid.innerHTML = html;
    }

    function toggleAINum(n) {
      if (aiSelected.has(n)) {
        aiSelected.delete(n);
        document.getElementById('ai_nb' + n).classList.remove('sel');
      } else {
        if (aiSelected.size >= MAX_AI_SEL) {
          alert("고정 번호는 최대 5개까지만 선택 가능합니다.");
          return;
        }
        aiSelected.add(n);
        document.getElementById('ai_nb' + n).classList.add('sel');
      }
      updateAISelectedDisplay();
    }

    function updateAISelectedDisplay() {
      const el = document.getElementById('aiSelectedDisplay');
      if (aiSelected.size === 0) {
        el.innerHTML = '<span class="sel-placeholder">반드시 포함할 고정 번호를 선택하세요 (선택안함 가능)</span>';
      } else {
        const sorted = [...aiSelected].sort((a, b) => a - b);
        el.innerHTML = sorted.map(n => `<div class="ball sm ${ballColor(n)}">${n}</div>`).join('');
      }
    }

    function generateAIGames() {
      const el = document.getElementById('aiResult');
      el.innerHTML = '<div class="loading"><div class="spinner"></div><div class="loading-text">AI가 최적의 번호를 조합 중입니다…</div></div>';

      setTimeout(() => {
        let html = '';
        for (let i = 0; i < 5; i++) {
          const nums = new Set([...aiSelected]);
          while (nums.size < 6) {
            nums.add(Math.floor(Math.random() * 45) + 1);
          }
          const sortedNums = [...nums].sort((a, b) => a - b);
          html += `
      <div class="result-row" style="justify-content:center; padding: 20px;">
        <div class="rno" style="min-width:auto; margin-right:14px; text-align:center;"><strong style="color:var(--gold2); font-size:1.1rem;">Game ${i + 1}</strong></div>
        <div class="balls-row" style="margin-bottom:0; justify-content:center;">
          ${sortedNums.map(n => makeBall(n)).join('')}
        </div>
      </div>`;
        }
        el.innerHTML = html;
      }, 1200);
    }

    ];

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function findNearbyStores() {
      const el = document.getElementById('storesResult');

      if (!navigator.geolocation) {
        el.innerHTML = '<div class="err">이 브라우저에서는 위치 정보(GPS)를 지원하지 않습니다.</div>';
        return;
      }

      el.innerHTML = '<div class="loading"><div class="spinner"></div><div class="loading-text">위치 정보를 받아오는 중… (스마트폰 GPS를 켜고 권한을 허용해 주세요)</div></div>';

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const userLat = position.coords.latitude;
          const userLng = position.coords.longitude;

          const maxRadius = parseFloat(document.getElementById('radiusSlider').value);
          const minWins = parseInt(document.getElementById('minWinsSlider').value);

          const storesWithDistance = topStores.map(store => {
            return {
              ...store,
              distance: getDistance(userLat, userLng, store.lat, store.lng)
            };
          }).filter(store => store.distance <= maxRadius && store.wins >= minWins);

          // 거리(distance)가 가까운 순으로 오름차순 정렬
          storesWithDistance.sort((a, b) => a.distance - b.distance);

          let nearby = storesWithDistance;

          let html = '';
          if (nearby.length === 0) {
            html = `<div class="err" style="background:var(--bg2); border-radius:12px; padding:20px;">설정한 조건(반경 ${maxRadius}km, 최소 ${minWins}번)에 맞는 명당이 없습니다.<br><br>조건을 완화해서 다시 시도해보세요.</div>`;
          } else {
            html = `<div class="count-badge">내 위치 반경 ${maxRadius}km 이내 명당 (총 ${nearby.length}곳)</div>
            <div class="results-list">`;
            
            nearby.forEach((s, idx) => {
              html += `
              <div class="result-row" style="align-items:flex-start; flex-direction:column; gap:8px; position:relative;">
                <div style="display:flex; justify-content:space-between; width:100%; align-items:center;">
                  <div style="font-size:1.05rem; font-weight:700; color:var(--text);">${idx + 1}. ${s.name}</div>
                  <div style="background:var(--gold); color:#000; font-weight:700; padding:3px 8px; border-radius:6px; font-size:0.85rem;">1등 ${s.wins}번</div>
                </div>
                <div style="font-size:0.85rem; color:var(--muted);">${s.address}</div>
                <div style="display:flex; justify-content:space-between; width:100%; align-items:flex-end; margin-top:4px;">
                  <div style="font-size:0.8rem; color:#48baf0; font-family:'Space Mono', monospace;">📍 약 ${s.distance.toFixed(1)}km 거리</div>
                  <div style="font-size:0.75rem; color:#888;">최근 1등: ${s.latestDate}</div>
                </div>
              </div>`;
            });
            html += `</div>`;
          }
          el.innerHTML = html;
        },
        (err) => {
          el.innerHTML = '<div class="err">위치 정보를 가져오는데 실패했습니다. 권한 거부, 또는 스마트폰의 GPS 기능이 꺼져있을 수 있습니다.</div>';
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // ── 패널 5: 해몽 분석 ───────────────────────────────────────────────
    async function analyzeDream() {
      const input = document.getElementById('dreamInput').value.trim();
      const el = document.getElementById('dreamResult');
      
      if (!input) {
        alert('꿈 내용을 입력해주세요.');
        return;
      }

      el.innerHTML = '<div class="loading"><div class="spinner"></div><div class="loading-text">AI 해몽가가 꿈을 분석하고 복권 당첨운을 계산 중입니다... (약 10~15초 소요)</div></div>';

      try {
        const response = await fetch('/api/dream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dream: input })
        });

        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || '분석 중 오류가 발생했습니다.');
        }

        const starsCount = Math.min(5, Math.max(1, parseInt(data.stars) || 1));
        const emptyStars = 5 - starsCount;
        
        const starsHtml = '⭐'.repeat(starsCount) + '<span style="opacity:0.3; filter: grayscale(1);">' + '⭐'.repeat(emptyStars) + '</span>';

        el.innerHTML = `
          <div class="result-card" style="padding: 24px;">
            <div style="text-align:center; margin-bottom: 24px;">
              <div style="font-size: 1.1rem; color: var(--muted); margin-bottom: 8px;">AI가 분석한 당신의 복권 운</div>
              <div style="font-size: 2.5rem; letter-spacing: 4px;">${starsHtml}</div>
              <div style="font-size: 1.2rem; font-weight: bold; color: var(--gold); margin-top: 8px;">${starsCount} / 5 점</div>
            </div>
            <div style="border-top: 1px solid var(--border); padding-top: 20px;">
              <div style="font-size: 0.9rem; color: var(--gold); margin-bottom: 8px; font-weight: bold;">🌙 해몽 풀이</div>
              <div style="font-size: 1.05rem; line-height: 1.7; color: var(--text); white-space: pre-wrap;">${data.interpretation}</div>
            </div>
          </div>
        `;
      } catch (error) {
        el.innerHTML = `<div class="err">${error.message}</div>`;
      }
    }

    // ── 초기화 ─────────────────────────────────────────────────────────
    buildNumGrid();
    buildAINumGrid();
    switchTab(0);
    // 기본으로 최신 1회차 미리 로드
    (async () => {
      try {
        const d = await fetchRound(1220);
        if (d) {
          document.getElementById('roundInput').placeholder = `회차 입력 (최신: ${d.no}회)`;
        }
      } catch (e) { }
    })();
  </script>
